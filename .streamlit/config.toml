# Tema base de Streamlit. El aspecto final (y el modo oscuro) se resuelve en
# `src/estilos.py`, que inyecta la hoja de estilos según el interruptor de la
# barra lateral. Aquí solo se fija un punto de partida coherente con la paleta
# clara para evitar un parpadeo al cargar.
[theme]
base = "light"
primaryColor = "#0D9488"
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"

[browser]
gatherUsageStats = false
